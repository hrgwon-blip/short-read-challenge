    function App() {
      const [viewMode, setViewMode] = useState("mobile"); // "mobile" | "fullscreen"
      const [articles, setArticles] = useState(PRESET_ARTICLES);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [streak, setStreak] = useState(3);
      const [timerSec, setTimerSec] = useState(0);
      const [isTimerComplete, setIsTimerComplete] = useState(false);
      const [fontSize, setFontSize] = useState("base");
      
      const [isQuizOpen, setIsQuizOpen] = useState(false);
      const [currentQuizStep, setCurrentQuizStep] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [quizStatus, setQuizStatus] = useState("idle");
      const [isCompletedToday, setIsCompletedToday] = useState(false);
      const [showHintModal, setShowHintModal] = useState(false);

      const [isApiModalOpen, setIsApiModalOpen] = useState(false);
      const [apiKey, setApiKey] = useState("");
      const [customTopic, setCustomTopic] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);

      const currentArticle = articles[currentIndex];

      useEffect(() => {
        const savedStreak = localStorage.getItem("shortread_streak");
        if (savedStreak) setStreak(parseInt(savedStreak, 10));
        const savedKey = localStorage.getItem("gemini_api_key");
        if (savedKey) setApiKey(savedKey);
      }, []);

      useEffect(() => {
        let interval = null;
        if (!isTimerComplete && !isCompletedToday) {
          interval = setInterval(() => {
            setTimerSec(prev => {
              if (prev + 1 >= currentArticle.readingTimeSec) {
                setIsTimerComplete(true);
                clearInterval(interval);
                return currentArticle.readingTimeSec;
              }
              return prev + 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [currentIndex, isTimerComplete, isCompletedToday]);

      const handleSelectArticle = (index) => {
        setCurrentIndex(index);
        setTimerSec(0);
        setIsTimerComplete(false);
        setIsQuizOpen(false);
        setCurrentQuizStep(0);
        setSelectedOption(null);
        setQuizStatus("idle");
        setIsCompletedToday(false);
      };

      const handleAnswer = (optionIdx) => {
        setSelectedOption(optionIdx);
        const activeQuiz = currentArticle.quiz[currentQuizStep];

        if (optionIdx === activeQuiz.answer) {
          setQuizStatus("correct");
          setTimeout(() => {
            if (currentQuizStep + 1 < currentArticle.quiz.length) {
              setCurrentQuizStep(prev => prev + 1);
              setSelectedOption(null);
              setQuizStatus("idle");
            } else {
              setIsQuizOpen(false);
              setIsCompletedToday(true);
              const newStreak = streak + 1;
              setStreak(newStreak);
              localStorage.setItem("shortread_streak", newStreak.toString());
              triggerConfetti();
            }
          }, 1000);
        } else {
          setQuizStatus("wrong");
          setShowHintModal(true);
        }

        if (window.confetti) {
          window.confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      };

        if (!apiKey.trim()) {
          alert("Google Gemini API 키를 입력해주세요. (무료 발급: aistudio.google.com)");
          return;
        }
        if (!customTopic.trim()) {
          alert("생성하고 싶은 지문의 주제를 입력해주세요.");
          return;
        }

        setIsGenerating(true);

          const prompt = `너는 고등학교 1학년 교과/시사 전문 국어 선생님이야.
학생들이 숏폼 중독에서 벗어나 문해력을 키울 수 있도록 다음 주제에 맞는 400자 내외 칼럼 지문 1개와 3단계 문해력 퀴즈 3문제를 만들어줘.
주제: "${customTopic}"

반드시 Markdown 코드 블록(예: \`\`\`json) 없이 오직 유효한 순수 JSON만 반환해:
{
  "category": "분야(예: 통합사회, 과학기술, 인문철학)",
  "title": "흥미로운 제목",
  "content": "400자 내외의 잘 쓰여진 본문",
  "keyVocabulary": ["어휘1", "어휘2", "어휘3"],
  "quiz": [
    {
      "level": 1,
      "type": "어휘력",
      "question": "핵심 어휘의 뜻을 묻는 질문",
      "options": ["보기1", "보기2", "보기3", "보기4"],
      "answer": 0,
      "hint": "본문의 몇 번째 문장을 짚어주는 친절한 힌트"
    },
    {
      "level": 2,
      "type": "핵심 요지",
      "question": "글의 중심 내용을 묻는 질문",
      "options": ["보기1", "보기2", "보기3", "보기4"],
      "answer": 1,
      "hint": "글쓴이의 핵심 결론을 짚어주는 힌트"
    },
    {
      "level": 3,
      "type": "비판적 추론",
      "question": "맥락을 추론하고 비판적으로 적용하는 질문",
      "options": ["보기1", "보기2", "보기3", "보기4"],
      "answer": 2,
      "hint": "사회적 맥락과 연결 지어 생각해보도록 유도하는 힌트"
    }
  ]
}`;

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
              })
            }
          );

          const data = await response.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) {
            const rawText = data.candidates[0].content.parts[0].text;
            const parsed = JSON.parse(rawText);
            const newArticle = {
              id: `custom-${Date.now()}`,
              category: parsed.category || "AI 실시간 생성",
              title: parsed.title,
              readingTimeSec: 30,
              content: parsed.content,
              keyVocabulary: parsed.keyVocabulary || ["핵심", "개념", "이해"],
              quiz: parsed.quiz
            };

            setArticles([newArticle, ...articles]);
            setCurrentIndex(0);
            setIsApiModalOpen(false);
            setCustomTopic("");
            localStorage.setItem("gemini_api_key", apiKey);
            handleSelectArticle(0);
            alert("✨ AI가 새로운 맞춤 지문과 퀴즈를 완성했습니다!");
          } else {
            throw new Error("AI 응답 형식이 올바르지 않습니다.");
          }
        } catch (err) {
          alert("Gemini 생성 중 오류가 발생했습니다: " + err.message);
        } finally {
          setIsGenerating(false);
        }
      };

      const fontClasses = {
        sm: "text-sm leading-relaxed",
        base: "text-base leading-relaxed sm:text-lg sm:leading-8",
        lg: "text-lg leading-loose sm:text-xl sm:leading-9"
      };

      const progressPercent = Math.min(100, Math.round((timerSec / currentArticle.readingTimeSec) * 100));

      return (
        <div class="flex flex-col items-center">
          
          {/* 상단 안내 바 */}
          <div class="w-full max-w-md mb-3 flex items-center justify-between text-xs text-slate-400 px-2">
            <div class="flex items-center space-x-1">
              <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span class="font-medium text-slate-300">대전교육정보원 AI 창작 챌린지 출품작</span>
            </div>
            <div class="flex space-x-2">
              <button 
                onClick={() => setViewMode(viewMode === "mobile" ? "fullscreen" : "mobile")}
                class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
              >
                {viewMode === "mobile" ? "🖥️ 넓은 화면" : "📱 모바일 뷰"}
              </button>
              <button 
                onClick={() => setIsApiModalOpen(true)}
                class="px-2.5 py-1 rounded-lg bg-violet-600 hover:bg-violet-500 text-white font-medium transition shadow-sm flex items-center space-x-1"
              >
                <span>✨ AI 생성</span>
              </button>
            </div>
          </div>

          {/* 앱 프레임 */}
          <div class={`w-full bg-white transition-all duration-300 ${
            viewMode === "mobile" 
              ? "max-w-md rounded-[38px] shadow-2xl border-[8px] border-slate-800 overflow-hidden relative" 
              : "max-w-3xl rounded-2xl shadow-xl border border-slate-700"
          }`}>
            
            {viewMode === "mobile" && (
              <div class="w-full bg-slate-900 text-slate-300 px-6 py-2 flex items-center justify-between text-xs font-semibold select-none">
                <span>09:41</span>
                <div class="w-20 h-4 bg-black rounded-full mx-auto"></div>
                <div class="flex items-center space-x-1.5">
                  <span>5G</span>
                  <span>100%</span>
                </div>
              </div>
            )}

            {/* 헤더 */}
            <div class="bg-gradient-to-r from-violet-600 to-indigo-600 text-white p-4 sm:p-5">
              <div class="flex items-center justify-between">
                <div>
                  <div class="flex items-center space-x-2">
                    <span class="bg-white/20 text-white text-[11px] font-bold px-2 py-0.5 rounded-full backdrop-blur-sm">
                      고1 문해력 복원
                    </span>
                    <span class="text-xs text-violet-200">Shorts to Short-Read</span>
                  </div>
                  <h1 class="text-xl font-extrabold tracking-tight mt-1 flex items-center space-x-1.5">
                    <span>쇼츠 말고 숏글</span>
                    <span class="text-[11px] bg-amber-400 text-amber-950 font-bold px-1.5 py-0.5 rounded ml-1">AI Challenge</span>
                  </h1>
                </div>

                {/* 스트릭 배지 */}
                <div class="flex flex-col items-end">
                  <div class="flex items-center bg-white/15 px-3 py-1.5 rounded-2xl backdrop-blur-md border border-white/20 shadow-inner">
                    <span class="text-xl mr-1">🔥</span>
                    <div>
                      <div class="text-[10px] text-violet-200 font-medium leading-none">연속 달성</div>
                      <div class="text-sm font-black text-amber-300 leading-tight">{streak}일째 성공!</div>
                    </div>
                  </div>
                </div>
              </div>

              {/* 지문 탭 목록 */}
              <div class="flex items-center space-x-2 mt-4 overflow-x-auto pb-1 text-xs">
                {articles.map((item, idx) => (
                  <button
                    key={item.id}
                    onClick={() => handleSelectArticle(idx)}
                    class={`whitespace-nowrap px-3 py-1.5 rounded-xl font-medium transition ${
                      currentIndex === idx
                        ? "bg-white text-violet-700 shadow-md font-bold"
                        : "bg-white/10 text-white hover:bg-white/20"
                    }`}
                  >
                    #{idx + 1} {item.category.split("·")[0].trim()}
                  </button>
                ))}
              </div>
            </div>

            {/* 본문 카드 */}
            <div class="p-5 sm:p-6 bg-slate-50 flex flex-col justify-between min-h-[480px]">
              <div>
                <div class="flex items-center justify-between pb-3 border-b border-slate-200">
                  <span class="text-xs font-semibold text-violet-600 bg-violet-100 px-2 py-0.5 rounded-md">
                    {currentArticle.category}
                  </span>
                  
                  <div class="flex items-center space-x-1 bg-white border border-slate-200 rounded-lg p-0.5">
                    <button 
                      onClick={() => setFontSize("sm")}
                      class={`px-2 py-0.5 text-xs rounded font-medium ${fontSize === "sm" ? "bg-violet-600 text-white" : "text-slate-500 hover:text-slate-800"}`}
                    >
                      가-
                    </button>
                    <button 
                      onClick={() => setFontSize("base")}
                      class={`px-2 py-0.5 text-xs rounded font-medium ${fontSize === "base" ? "bg-violet-600 text-white" : "text-slate-500 hover:text-slate-800"}`}
                    >
                      보통
                    </button>
                    <button 
                      onClick={() => setFontSize("lg")}
                      class={`px-2 py-0.5 text-xs rounded font-medium ${fontSize === "lg" ? "bg-violet-600 text-white" : "text-slate-500 hover:text-slate-800"}`}
                    >
                      가+
                    </button>
                  </div>
                </div>

                <h2 class="text-lg sm:text-xl font-bold text-slate-900 mt-3.5 tracking-tight">
                  {currentArticle.title}
                </h2>

                <div class="flex items-center space-x-1.5 mt-2 mb-3">
                  <span class="text-[11px] font-semibold text-slate-400">오늘의 핵심 어휘:</span>
                  {currentArticle.keyVocabulary.map((word, i) => (
                    <span key={i} class="text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200/60 px-2 py-0.5 rounded-md">
                      {word}
                    </span>
                  ))}
                </div>

                <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 text-slate-800 text-justify">
                  <p class={fontClasses[fontSize]}>
                    {currentArticle.content}
                  </p>
                </div>
              </div>

              {/* 하단 타이머 & 액션 */}
              <div class="mt-6 pt-4 border-t border-slate-200">
                <div class="mb-3">
                  <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1.5">
                    <span class="flex items-center space-x-1">
                      <span>⏱️ 뇌 집중 정독 타이머</span>
                      {isTimerComplete && <span class="text-emerald-600 font-bold">(정독 완료!)</span>}
                    </span>
                    <span class={isTimerComplete ? "text-emerald-600 font-bold" : "text-violet-600 font-bold"}>
                      {timerSec}s / {currentArticle.readingTimeSec}s
                    </span>
                  </div>
                  <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                    <div 
                      class={`h-full transition-all duration-1000 ${
                        isTimerComplete ? "bg-emerald-500" : "bg-gradient-to-r from-violet-500 to-indigo-500"
                      }`}
                      style={{ width: `${progressPercent}%` }}
                    ></div>
                  </div>
                </div>

                {isCompletedToday ? (
                  <div class="w-full py-3.5 px-4 bg-emerald-50 border border-emerald-300 rounded-2xl flex items-center justify-between text-emerald-800">
                    <div class="flex items-center space-x-2">
                      <span class="text-xl">🏆</span>
                      <span class="font-bold text-sm">오늘의 문해력 챌린지 성공!</span>
                    </div>
                    <button
                      onClick={triggerConfetti}
                      class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-xl transition"
                    >
                      폭죽 발사 🎉
                    </button>
                  </div>
                ) : (
                  <button
                    disabled={!isTimerComplete}
                    onClick={() => {
                      setIsQuizOpen(true);
                      setCurrentQuizStep(0);
                      setSelectedOption(null);
                      setQuizStatus("idle");
                    }}
                    class={`w-full py-4 rounded-2xl font-bold text-base shadow-md transition-all flex items-center justify-center space-x-2 ${
                      isTimerComplete
                        ? "bg-violet-600 hover:bg-violet-700 text-white cursor-pointer transform hover:-translate-y-0.5 active:translate-y-0"
                        : "bg-slate-300 text-slate-500 cursor-not-allowed"
                    }`}
                  >
                    {isTimerComplete ? (
                      <>
                        <span>🚀 3단계 문해력 퀴즈 풀기</span>
                        <span class="bg-white/20 text-xs px-2 py-0.5 rounded-full">도전하기</span>
                      </>
                    ) : (
                      <span>🔒 지문을 정독해주세요 ({currentArticle.readingTimeSec - timerSec}초 남음)</span>
                    )}
                  </button>
                )}
              </div>

            </div>

          </div>

          {/* 퀴즈 모달 */}
          {isQuizOpen && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-200">
                
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div class="flex items-center space-x-2">
                    <span class="bg-violet-600 text-white font-bold text-xs px-2.5 py-1 rounded-lg">
                      {currentQuizStep + 1}단계 / 3문제
                    </span>
                    <span class="text-xs font-bold text-slate-500">
                      [{currentArticle.quiz[currentQuizStep].type}]
                    </span>
                  </div>
                  <button 
                    onClick={() => setIsQuizOpen(false)}
                    class="text-slate-400 hover:text-slate-600 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <h3 class="text-base sm:text-lg font-bold text-slate-900 mt-4 mb-5">
                  Q{currentQuizStep + 1}. {currentArticle.quiz[currentQuizStep].question}
                </h3>

                <div class="space-y-2.5">
                  {currentArticle.quiz[currentQuizStep].options.map((opt, oIdx) => {
                    const isSelected = selectedOption === oIdx;
                    let btnClass = "border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800";

                    if (isSelected) {
                      if (quizStatus === "correct") {
                        btnClass = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-2 ring-emerald-400";
                      } else if (quizStatus === "wrong") {
                        btnClass = "border-rose-500 bg-rose-50 text-rose-900 font-bold ring-2 ring-rose-400";
                      }
                    }

                    return (
                      <button
                        key={oIdx}
                        disabled={quizStatus === "correct"}
                        onClick={() => handleAnswer(oIdx)}
                        class={`w-full text-left p-3.5 rounded-xl border text-sm transition-all flex items-start space-x-2.5 ${btnClass}`}
                      >
                        <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-xs font-bold shrink-0 mt-0.5">
                          {oIdx + 1}
                        </span>
                        <span>{opt}</span>
                      </button>
                    );
                  })}
                </div>

                <div class="mt-4 pt-3 text-center">
                  {quizStatus === "correct" && (
                    <div class="text-emerald-600 font-bold text-sm flex items-center justify-center space-x-1 animate-bounce">
                      <span>🎉 정답입니다! 다음 단계로 넘어갑니다...</span>
                    </div>
                  )}
                  {quizStatus === "wrong" && (
                    <div class="text-rose-600 font-semibold text-xs">
                      아쉬워요! 다시 확인해볼까요? AI 튜터 힌트를 확인하세요.
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* 1:1 AI 국어 튜터 힌트 모달 */}
          {showHintModal && (
            <div class="fixed inset-0 bg-black/50 z-60 flex items-center justify-center p-4">
              <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl border-2 border-amber-300">
                <div class="flex items-center space-x-2 text-amber-600 font-bold mb-2">
                  <span class="text-2xl">👩‍🏫</span>
                  <span>1:1 AI 국어 선생님 힌트</span>
                </div>
                <p class="text-sm text-slate-700 bg-amber-50 p-3 rounded-xl border border-amber-200 leading-relaxed">
                  {currentArticle.quiz[currentQuizStep].hint}
                </p>
                <button
                  onClick={() => setShowHintModal(false)}
                  class="w-full mt-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-sm transition"
                >
                  다시 풀어보기
                </button>
              </div>
            </div>
          )}

          {/* Gemini AI 실시간 생성 모달 */}
          {isApiModalOpen && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div class="flex items-center space-x-2">
                    <span class="text-violet-600 text-xl font-bold">✨</span>
                    <h3 class="font-bold text-slate-900 text-base">Gemini AI 실시간 지문 생성</h3>
                  </div>
                  <button onClick={() => setIsApiModalOpen(false)} class="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <div class="mt-4 space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">
                      Google Gemini API Key (무료)
                    </label>
                    <input
                      type="password"
                      placeholder="AIzaSy... 키를 입력하세요"
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-violet-500 outline-none"
                    />
                    <span class="text-[11px] text-slate-400 mt-1 block">
                      * 키가 없어도 기본 내장 3종 지문으로 공모전 시연이 완벽히 가능합니다.
                    </span>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">
                      생성하고 싶은 칼럼 주제
                    </label>
                    <input
                      type="text"
                      placeholder="예: 우주 탐사, 청소년 스마트폰 수면권, 인공지능 저작권"
                      value={customTopic}
                      onChange={(e) => setCustomTopic(e.target.value)}
                      class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-violet-500 outline-none"
                    />
                  </div>

                  <button
                    disabled={isGenerating}
                    onClick={handleGenerateWithGemini}
                    class="w-full py-3 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl text-sm transition shadow-md flex items-center justify-center space-x-2"
                  >
                    {isGenerating ? (
                      <>
                        <span class="animate-spin">⏳</span>
                        <span>AI가 지문과 3단계 퀴즈를 생성 중...</span>
                      </>
                    ) : (
                      <span>생성하여 챌린지 시작하기 🚀</span>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
