    // Web Audio API 사운드 및 모바일 햅틱 진동 효과음
    const soundEffects = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      // 모바일 기기 진동 (Android/지원 브라우저 Web Vibration API)
      vibrate(pattern = 120) {
        try {
          if (typeof navigator !== 'undefined' && navigator.vibrate) {
            navigator.vibrate(pattern);
          }
        } catch (e) {
          console.log("Vibration not supported/blocked", e);
        }
      },
      playTone(freq, type, duration, delay = 0, vol = 0.12) {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch (e) {
          console.log("Audio error", e);
        }
      },
      click() {
        this.playTone(600, 'sine', 0.06);
      },
      // 5초 남았을 때 1초마다 긴장감 주는 비프음 + 햅틱 진동 울림
      countdownTick(remainingSec) {
        // 5초에서 1초로 갈수록 주파수를 점진적으로 높여 정독 집중도 극대화 (587Hz -> 987Hz)
        const freqs = { 5: 587.33, 4: 659.25, 3: 739.99, 2: 830.61, 1: 987.77 };
        const freq = freqs[remainingSec] || 700;
        this.playTone(freq, 'sine', 0.09, 0, 0.16);
        this.vibrate(120); // 120ms 모바일 햅틱 진동
      },
      timerDone() {
        this.playTone(523.25, 'sine', 0.15, 0);
        this.playTone(659.25, 'sine', 0.25, 0.12);
        this.vibrate([120, 60, 200]); // 정독 완료 2단 축하 진동
      },
      correct() {
        this.playTone(523.25, 'triangle', 0.12, 0);
        this.playTone(659.25, 'triangle', 0.12, 0.1);
        this.playTone(783.99, 'triangle', 0.3, 0.2);
        this.vibrate(100);
      },
      wrong() {
        this.playTone(280, 'sawtooth', 0.15, 0);
        this.playTone(220, 'sawtooth', 0.25, 0.12);
        this.vibrate([80, 50, 80]);
      },
      celebrate() {
        this.playTone(523.25, 'triangle', 0.15, 0);
        this.playTone(659.25, 'triangle', 0.15, 0.1);
        this.playTone(783.99, 'triangle', 0.15, 0.2);
        this.playTone(1046.50, 'triangle', 0.4, 0.3);
        this.vibrate([150, 80, 250]);
      }
    };

    // 4단계 학습 레벨 카드 정의 (메인 홈 화면용)

      {

        icon: "🌱",

      {

        title: "중학생",

    function App() {
      // 3단계 화면 네비게이션: 'home' (메인 홈) -> 'article_select' (지문 선택) -> 'reading' (정독 및 퀴즈)
      const [currentScreen, setCurrentScreen] = useState("home");
      const [viewMode, setViewMode] = useState("mobile");
      const [isMuted, setIsMuted] = useState(false);
      
      const [selectedLevel, setSelectedLevel] = useState("고등");
      const [articleIdx, setArticleIdx] = useState(0);
      const [switchKey, setSwitchKey] = useState(0);

      const [timerSec, setTimerSec] = useState(0);
      const [elapsedMs, setElapsedMs] = useState(0);
      const [isTimerStarted, setIsTimerStarted] = useState(false);
      const [isTimerComplete, setIsTimerComplete] = useState(false);
      const [fontSize, setFontSize] = useState("base");

      const startTimeRef = useRef(0);
      const lastTickSecRef = useRef(-1);

      const [isQuizOpen, setIsQuizOpen] = useState(false);
      const [currentQuizStep, setCurrentQuizStep] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [quizStatus, setQuizStatus] = useState("idle");
      const [isCompletedToday, setIsCompletedToday] = useState(false);
      const [showHintModal, setShowHintModal] = useState(false);
      const [showChallengeBox, setShowChallengeBox] = useState(true);

      const currentArticle = LEVEL_ARTICLES[selectedLevel][articleIdx];
      const currentTheme = LEVEL_THEMES[selectedLevel] || LEVEL_THEMES["고등"];

      useEffect(() => {
        let interval = null;
        if (currentScreen === "reading" && isTimerStarted && !isTimerComplete && !isCompletedToday) {
          const totalMs = currentArticle.readingTimeSec * 1000;
          if (!startTimeRef.current) {
            startTimeRef.current = Date.now() - elapsedMs;
          }

          interval = setInterval(() => {
            const now = Date.now();
            const currentElapsed = Math.min(totalMs, now - startTimeRef.current);
            setElapsedMs(currentElapsed);
            
            const currentSec = Math.floor(currentElapsed / 1000);
            setTimerSec(currentSec);

            const remainingSec = Math.max(0, currentArticle.readingTimeSec - currentSec);

            // 5초 남았을 때 매 1초마다 모바일 진동 & 톤 알림음 발생
            if (remainingSec <= 5 && remainingSec > 0 && remainingSec !== lastTickSecRef.current) {
              lastTickSecRef.current = remainingSec;
              soundEffects.countdownTick(remainingSec);
            }

            if (currentElapsed >= totalMs) {
              setIsTimerComplete(true);
              setShowChallengeBox(true);
              soundEffects.timerDone();
              clearInterval(interval);
            }
          }, 40);
        }
        return () => clearInterval(interval);
      }, [currentScreen, isTimerStarted, isTimerComplete, isCompletedToday, currentArticle.readingTimeSec]);

      const handleSelectLevel = (lvl) => {
        soundEffects.click();
        setSelectedLevel(lvl);
        setCurrentScreen("article_select");
      };

      const handleSelectArticle = (idx) => {
        soundEffects.click();
        setArticleIdx(idx);
        setTimerSec(0);
        setElapsedMs(0);
        startTimeRef.current = 0;
        lastTickSecRef.current = -1;
        setIsTimerStarted(false);
        setIsTimerComplete(false);
        setShowChallengeBox(true);
        setIsQuizOpen(false);
        setCurrentQuizStep(0);
        setSelectedOption(null);
        setQuizStatus("idle");
        setIsCompletedToday(false);
        setSwitchKey(prev => prev + 1);
        setCurrentScreen("reading");
      };

      const handleStartTimer = () => {
        soundEffects.click();
        startTimeRef.current = Date.now();
        setElapsedMs(0);
        setTimerSec(0);
        lastTickSecRef.current = -1;
        setIsTimerComplete(false);
        setIsTimerStarted(true);
      };

      const handleRestartTimer = () => {
        soundEffects.click();
        startTimeRef.current = Date.now();
        setElapsedMs(0);
        setTimerSec(0);
        lastTickSecRef.current = -1;
        setIsTimerComplete(false);
        setShowChallengeBox(true);
        setIsTimerStarted(true);
      };

      const handleGoBackToHome = () => {
        soundEffects.click();
        setIsTimerStarted(false);
        setIsTimerComplete(false);
        startTimeRef.current = 0;
        setElapsedMs(0);
        setTimerSec(0);
        setCurrentScreen("home");
      };

      const handleGoBackToArticles = () => {
        soundEffects.click();
        setIsTimerStarted(false);
        setIsTimerComplete(false);
        startTimeRef.current = 0;
        setElapsedMs(0);
        setTimerSec(0);
        setCurrentScreen("article_select");
      };

      const handleAnswer = (optionIdx) => {
        setSelectedOption(optionIdx);
        const activeQuiz = currentArticle.quiz[currentQuizStep];

        if (optionIdx === activeQuiz.answer) {
          setQuizStatus("correct");
          soundEffects.correct();
          setTimeout(() => {
            if (currentQuizStep + 1 < currentArticle.quiz.length) {
              setCurrentQuizStep(prev => prev + 1);
              setSelectedOption(null);
              setQuizStatus("idle");
            } else {
              setIsQuizOpen(false);
              setIsCompletedToday(true);
              soundEffects.celebrate();
              triggerConfetti();
            }
          }, 1000);
        } else {
          setQuizStatus("wrong");
          soundEffects.wrong();
          setShowHintModal(true);
        }
      };

      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 160,
            spread: 85,
            origin: { y: 0.5 }
          });
        }
      };

      const toggleSound = () => {
        const next = !isMuted;
        setIsMuted(next);
        soundEffects.muted = next;
      };

      // 폰트 크기 매핑 (모바일 스마트폰 화면 해상도를 자동 인식하여 비율에 맞게 유동적으로 스케일링)
      const fontClasses = {
        sm: "fluid-text-sm text-slate-900 font-medium",
        base: "fluid-text-base text-slate-900 font-medium",
        lg: "fluid-text-lg text-slate-900 font-medium"
      };

      const totalDurationMs = (currentArticle?.readingTimeSec || 15) * 1000;
      // 독서 유도 애니메이션(하이라이트)은 시간 종료 1초 전에 100% 완독되도록 설정 (마지막 1초는 완독 상태 정리 및 버퍼)
      const readingAnimDurationMs = Math.max(1000, totalDurationMs - 1000);

      const totalChars = useMemo(() => {
        if (!currentArticle || !currentArticle.paragraphs) return 0;
        return currentArticle.paragraphs.reduce((sum, p) => sum + p.length, 0);
      }, [currentArticle]);

      let activeCharsTotal = 0;
      if (!isTimerStarted) {
        activeCharsTotal = 0;
      } else if (isTimerComplete) {
        activeCharsTotal = totalChars;
      } else {
        const ratio = Math.min(1, elapsedMs / readingAnimDurationMs);
        activeCharsTotal = Math.round(ratio * totalChars);
      }

      const progressPercent = Math.min(100, Math.round((elapsedMs / readingAnimDurationMs) * 100));
      const remainingSec = Math.max(0, currentArticle.readingTimeSec - timerSec);

      return (
        <div class="flex flex-col items-center w-full min-h-screen sm:min-h-0">

          {/* 메인 컨테이너 (둥근 모서리와 외곽 테두리 라인을 완전히 제거한 플랫 직사각형 앱) */}

            {/* ========== 1단계: 🏠 메인 홈 화면 (초/중/고/성인 레벨 선택) ========== */}
            {currentScreen === "home" && (

                    <h2 class="text-lg sm:text-xl font-black tracking-tight text-white mb-1.5">

            {/* ========== 2단계: 📋 지문 선택 화면 (선택된 난이도의 지문 1, 2, 3) ========== */}
            {currentScreen === "article_select" && (
              <div class={`p-3.5 sm:p-5 bg-gradient-to-b ${currentTheme.bgGradient} animate-content-switch`}>
                <div>
                  {/* 상단 네비게이션 서브 헤더 */}
                  <div class={`flex items-center justify-between pb-2.5 mb-3.5 border-b ${currentTheme.navBorder}`}>
                    <button
                      onClick={handleGoBackToHome}
                      class={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg ${currentTheme.backBtn} text-sm sm:text-base font-black transition shadow-xs`}

                      <span class="text-base">‹</span>
                      <span>레벨 다시 선택</span>
                    </button>

                    <span class={`text-sm sm:text-base font-black px-3 py-1.5 rounded-lg border shadow-xs ${currentTheme.tagClass}`}>
                      {selectedLevel} 코스 챌린지
                    </span>
                  </div>

                  {/* 안내 제목 */}
                  <div class="mb-3.5 px-0.5">
                    <h3 class={`text-lg sm:text-xl font-black ${currentTheme.headingColor} tracking-tight flex items-center space-x-2`}>
                      <span class="text-xl">📖</span>
                      <span>도전할 지문을 선택해 주세요</span>
                    </h3>
                  </div>

                  {/* 지문 3개 리스트 카드 */}
                  <div class="space-y-3">
                    {LEVEL_ARTICLES[selectedLevel].map((art, idx) => (
                      <button
                        key={art.id}
                        onClick={() => handleSelectArticle(idx)}
                        class={`w-full py-4 px-4 bg-white ${currentTheme.cardBorderHover} border-2 border-slate-200 rounded-xl text-left transition-all duration-200 shadow-sm hover:shadow-md flex items-center space-x-3.5 group active:scale-[0.99]`}
                      >
                        <span class={`w-10 h-10 rounded-lg ${currentTheme.badgeNumber} font-black text-base flex items-center justify-center shrink-0 shadow-xs`}>
                          0{idx + 1}
                        </span>
                        <div class="min-w-0 flex-1">
                          <h4 class={`text-base sm:text-lg font-black text-slate-900 ${currentTheme.titleHover} tracking-tight leading-snug truncate`}>
                            {art.title}
                          </h4>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ========== 3단계: 📖 지문 정독 & 퀴즈 챌린지 화면 ========== */}
            {currentScreen === "reading" && (
              <div key={switchKey} class="animate-content-switch">

                {/* 상단 서브 네비게이션 (지문 목록으로, 홈으로) */}
                <div class={`px-2.5 py-1.5 ${currentTheme.navSubBar} shadow-sm flex items-center justify-between gap-1.5`}>
                  <button
                    onClick={handleGoBackToArticles}
                    class={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg ${currentTheme.backBtn} text-sm sm:text-base font-black transition shadow-xs`}
                  >
                    <span class="text-base">‹</span>
                    <span>지문 목록</span>
                  </button>

                  <div class="flex items-center space-x-1 font-black text-sm sm:text-base">
                    <span class={`px-2.5 py-1 rounded-md border shadow-xs ${currentTheme.tagClass}`}>
                      {selectedLevel} · 지문 {articleIdx + 1}
                    </span>
                  </div>

                  <button
                    onClick={handleGoBackToHome}
                    class={`px-3 py-1.5 rounded-lg ${currentTheme.backBtn} text-sm sm:text-base font-black transition shadow-xs flex items-center space-x-1`}
                  >
                    <span>🏠</span>
                    <span>홈</span>
                  </button>
                </div>

                {/* 3. 본문 박스 (타이머 일체형 & 중간 퀴즈도전 팝업) */}
                <div class="relative bg-slate-100 flex flex-col justify-between overflow-hidden">
                  {/* 본문 상단 타이머 프로그레스 게이지 바 (좌->우 차오름) */}
                  <div class="h-2 w-full bg-slate-200 overflow-hidden">
                    <div
                      class={`h-full bg-gradient-to-r ${currentTheme.timerFill} transition-all duration-300 ease-linear`}
                      style={{ width: `${progressPercent}%` }}
                    />
                  </div>

                  <div class="px-3 py-2 sm:px-4 sm:py-2.5">
                    {/* 상단 '시작' 버튼 / 카운트다운 & 폰트 크기 조절 바 */}
                    <div class="flex items-center justify-between pb-2 mb-1.5 border-b border-slate-200">
                      {/* 좌측: 시작 버튼 또는 진행 타이머 카운트다운 */}
                      <div class="flex items-center">
                        {!isTimerStarted ? (
                          <button
                            onClick={handleStartTimer}
                            class={`px-4 py-1.5 rounded-lg ${currentTheme.primaryBtn} active:scale-95 text-white text-sm sm:text-base font-black transition shadow-xs flex items-center space-x-1.5 ring-2 animate-pulse`}
                          >
                            <span>▶</span>
                            <span>시작</span>
                          </button>
                        ) : (
                          <div class="flex items-center space-x-1.5">
                            <div class={`flex items-center space-x-1.5 text-sm sm:text-base font-black ${currentTheme.timerBadge} px-3 py-1 rounded-lg border shadow-2xs`}>
                              <span class="text-base">⏱️</span>
                              <span>
                                {isTimerComplete ? (
                                  <span class="font-extrabold">정독 완료!</span>
                                ) : (
                                  <span>집중정독 : <span class={`font-black ${remainingSec <= 5 ? "text-red-600 animate-pulse" : "text-slate-900"}`}>{remainingSec}초</span></span>
                                )}
                              </span>
                            </div>
                            {isTimerComplete && !showChallengeBox && (
                              <button
                                onClick={handleRestartTimer}
                                class="text-xs sm:text-sm text-slate-500 hover:text-slate-800 font-bold underline px-1 py-0.5 ml-1"
                                title="처음부터 다시 정독하기"
                              >
                                ↺ 다시 읽기
                              </button>
                            )}
                          </div>
                        )}
                      </div>

                      {/* 우측: 폰트 크기 조절 버튼 그룹 */}
                      <div class={`flex items-center space-x-1 bg-white border ${currentTheme.fontBoxBorder || "border-slate-300"} rounded-lg p-0.5 shadow-2xs`}>
                        <button 
                          onClick={() => setFontSize("sm")}
                          class={`px-2.5 py-1 text-sm sm:text-base rounded-md font-bold transition ${fontSize === "sm" ? currentTheme.activeFontBtn : currentTheme.inactiveFontBtn}`}
                        >
                          가-
                        </button>
                        <button 
                          onClick={() => setFontSize("base")}
                          class={`px-2.5 py-1 text-sm sm:text-base rounded-md font-bold transition ${fontSize === "base" ? currentTheme.activeFontBtn : currentTheme.inactiveFontBtn}`}
                        >
                          보통
                        </button>
                        <button 
                          onClick={() => setFontSize("lg")}
                          class={`px-2.5 py-1 text-sm sm:text-base rounded-md font-bold transition ${fontSize === "lg" ? currentTheme.activeFontBtn : currentTheme.inactiveFontBtn}`}
                        >
                          가+
                        </button>
                      </div>
                    </div>

                    {/* 지문 제목 (가운데 정렬 & 하단 강조 밑줄) */}
                    <div class="text-center mt-1.5 mb-1.5">
                      <h2 class={`inline-block text-xl sm:text-2xl md:text-3xl font-black text-emerald-950 tracking-tight leading-snug truncate max-w-full pb-0.5 border-b-2 ${currentTheme.titleUnderline}`}>
                        {currentArticle.title}
                      </h2>
                    </div>

                    {/* 지문 본문 카드: 시작 버튼 클릭 시 시간에 따라 글자 읽는 순서대로(한 줄씩 좌->우, 위에서 아래로) 자연스럽게 채워지는 독서 유도 애니메이션 */}
                    <div 
                      class={`relative px-4 py-4 sm:px-5 sm:py-5 rounded-xl border ${currentTheme.readingBorder || "border-slate-200"} book-typography transition-all duration-300 min-h-[300px] bg-white/95 shadow-xs overflow-hidden`}
                    >
                      {/* 본문 텍스트 레이어 (줄 단위 좌->우, 위->아래 실시간 독서 가이드 페이서) */}
                      <div class={`relative z-10 ${fontClasses[fontSize]}`}>
                        {currentArticle.paragraphs.map((pText, pIdx) => {
                          const charsBefore = currentArticle.paragraphs
                            .slice(0, pIdx)
                            .reduce((sum, p) => sum + p.length, 0);
                          const paraLen = pText.length;
                          
                          let highlightedCount = 0;
                          if (!isTimerStarted) {
                            highlightedCount = 0;
                          } else if (isTimerComplete) {
                            highlightedCount = paraLen;
                          } else {
                            highlightedCount = Math.min(
                              paraLen,
                              Math.max(0, activeCharsTotal - charsBefore)
                            );
                          }
                          
                          const readPart = pText.slice(0, highlightedCount);
                          const unreadPart = pText.slice(highlightedCount);

                          return (
                            <p key={pIdx} class="book-paragraph text-justify font-medium text-slate-800 leading-relaxed mb-3.5 last:mb-0">
                              {highlightedCount > 0 && (
                                <span class={`reading-highlight ${currentTheme.highlightClass}`}>
                                  {readPart}
                                </span>
                              )}
                              <span>{unreadPart}</span>
                            </p>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  {/* ★ 시간이 다 지나면 본문 중간에 나타나는 문해력 퀴즈 풀기 도전 박스 ★ */}
                  {isTimerComplete && !isCompletedToday && showChallengeBox && (
                    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[2px] z-20 flex items-center justify-center p-4 animate-in fade-in zoom-in duration-200">
                      <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-2xl border-2 border-emerald-500 text-center max-w-sm w-full animate-bounce-subtle">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto mb-3 text-3xl shadow-inner">
                          🎯
                        </div>
                        <h3 class="text-lg sm:text-xl font-black text-slate-900 mb-1.5">
                          정독 시간 완료!
                        </h3>
                        <p class="text-sm sm:text-base text-slate-600 mb-4 leading-relaxed font-medium">
                          글을 집중해서 모두 정독하셨나요?<br />
                          이제 3단계 문해력 퀴즈에 도전해 보세요!
                        </p>
                        <button
                          onClick={() => {
                            soundEffects.click();
                            setIsQuizOpen(true);
                            setCurrentQuizStep(0);
                            setSelectedOption(null);
                            setQuizStatus("idle");
                          }}
                          class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-base sm:text-lg rounded-xl shadow-lg ring-2 ring-emerald-300 transition-all flex items-center justify-center space-x-2"
                        >
                          <span>🚀</span>
                          <span>문해력 퀴즈 풀기 도전!</span>
                        </button>
                        <button
                          onClick={() => setShowChallengeBox(false)}
                          class="mt-3 text-sm text-slate-500 hover:text-slate-800 font-bold underline"
                        >
                          지문 다시 확인하기
                        </button>
                      </div>
                    </div>
                  )}

                  {/* 지문 다시 확인하기를 눌렀을 때 하단에 떠 있는 컴팩트 퀴즈 도전 바 */}
                  {isTimerComplete && !isCompletedToday && !showChallengeBox && (
                    <div class="p-3 bg-emerald-100 border-t-2 border-emerald-500 flex items-center justify-between shadow-md animate-in slide-in-from-bottom duration-200">
                      <span class="text-sm font-black text-emerald-950 flex items-center space-x-1.5">
                        <span class="text-base">🎯</span>
                        <span>정독 완료</span>
                      </span>
                      <button
                        onClick={() => {
                          soundEffects.click();
                          setIsQuizOpen(true);
                          setCurrentQuizStep(0);
                          setSelectedOption(null);
                          setQuizStatus("idle");
                        }}
                        class="py-2 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-sm sm:text-base rounded-lg shadow transition flex items-center space-x-1.5"
                      >
                        <span>🚀</span>
                        <span>문해력 퀴즈 풀기 도전!</span>
                      </button>
                    </div>
                  )}

                  {/* 퀴즈 3문제 완료 시 중간에 나타나는 완료 박스 */}
                  {isCompletedToday && (
                    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[2px] z-20 flex items-center justify-center p-4 animate-in fade-in zoom-in duration-200">
                      <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-2xl border-2 border-emerald-500 text-center max-w-xs w-full">
                        <div class="w-14 h-14 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-2.5 text-3xl shadow-inner">
                          🏆
                        </div>
                        <h3 class="text-base sm:text-lg font-black text-emerald-900 mb-1">
                          문해력 퀴즈 3문제 완료!
                        </h3>
                        <p class="text-xs text-slate-600 mb-4 font-medium">
                          오늘의 정독 챌린지를 멋지게 달성했습니다!
                        </p>
                        <div class="space-y-2">
                          <button
                            onClick={triggerConfetti}
                            class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs sm:text-sm rounded-lg transition shadow flex items-center justify-center space-x-1"
                          >
                            <span>🎉</span>
                            <span>폭죽 발사</span>
                          </button>
                          <button
                            onClick={handleGoBackToArticles}
                            class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-black text-xs sm:text-sm rounded-lg transition shadow flex items-center justify-center space-x-1"
                          >
                            <span>📋</span>
                            <span>다른 지문 도전하기</span>
                          </button>
                          <button
                            onClick={handleGoBackToHome}
                            class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-black text-xs sm:text-sm rounded-lg transition border border-slate-300 flex items-center justify-center space-x-1"
                          >
                            <span>🏠</span>
                            <span>홈으로</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

              </div>
            )}

          </div>

          {/* 퀴즈 모달 */}
          {isQuizOpen && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div class="bg-white w-full max-w-lg rounded-3xl p-4 sm:p-6 shadow-2xl border-2 border-emerald-500 animate-in fade-in zoom-in duration-200">
                
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-100">
                  <div class="flex items-center space-x-2">
                    <span class="bg-emerald-700 text-white font-black text-sm sm:text-base px-3 py-1 rounded-lg">
                      {currentQuizStep + 1}단계 / 3문제
                    </span>
                    <span class="text-sm sm:text-base font-black text-emerald-800 bg-emerald-100 px-2.5 py-0.5 rounded-md">
                      [{currentArticle.quiz[currentQuizStep].type}]
                    </span>
                  </div>
                  <button 
                    onClick={() => { soundEffects.click(); setIsQuizOpen(false); }}
                    class="text-slate-400 hover:text-slate-700 text-2xl font-black p-1 leading-none"
                  >
                    ✕
                  </button>
                </div>

                <h3 class="text-lg sm:text-xl md:text-2xl font-black text-slate-900 mt-3 mb-3.5 leading-snug book-typography">
                  Q{currentQuizStep + 1}. {currentArticle.quiz[currentQuizStep].question}
                </h3>

                <div class="space-y-2.5">
                  {currentArticle.quiz[currentQuizStep].options.map((opt, oIdx) => {
                    const isSelected = selectedOption === oIdx;
                    let btnClass = "border-slate-200 bg-slate-50 hover:bg-emerald-50 hover:border-emerald-300 text-slate-800";

                    if (isSelected) {
                      if (quizStatus === "correct") {
                        btnClass = "border-emerald-500 bg-emerald-100 text-emerald-950 font-black ring-2 ring-emerald-400";
                      } else if (quizStatus === "wrong") {
                        btnClass = "border-rose-500 bg-rose-100 text-rose-950 font-black ring-2 ring-rose-400";
                      }
                    }

                    return (
                      <button
                        key={oIdx}
                        disabled={quizStatus === "correct"}
                        onClick={() => handleAnswer(oIdx)}
                        class={`w-full text-left p-3 sm:p-3.5 rounded-xl border text-base sm:text-lg font-semibold transition-all flex items-start space-x-2.5 book-typography ${btnClass}`}
                      >
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-800 text-white text-xs sm:text-sm font-bold shrink-0 mt-0.5">
                          {oIdx + 1}
                        </span>
                        <span class="leading-relaxed">{opt}</span>
                      </button>
                    );
                  })}
                </div>

                <div class="mt-2.5 pt-1 text-center">
                  {quizStatus === "correct" && (
                    <div class="text-emerald-700 font-black text-sm sm:text-base flex items-center justify-center space-x-1 animate-bounce">
                      <span>🎉 정답입니다! 다음 단계로 넘어갑니다...</span>
                    </div>
                  )}
                  {quizStatus === "wrong" && (
                    <div class="text-rose-600 font-bold text-xs sm:text-sm">
                      아쉬워요! 다시 확인해볼까요? AI 튜터 힌트를 확인하세요.
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* 1:1 AI 국어 튜터 힌트 모달 */}
          {showHintModal && (
            <div class="fixed inset-0 bg-black/60 z-60 flex items-center justify-center p-3">
              <div class="bg-white w-full max-w-sm rounded-3xl p-4 sm:p-5 shadow-2xl border-4 border-amber-400">
                <div class="flex items-center space-x-2 text-amber-700 font-black mb-2">
                  <span class="text-3xl">👩‍🏫</span>
                  <span class="text-base sm:text-lg">1:1 AI 국어 선생님 힌트</span>
                </div>
                <p class="text-sm sm:text-base text-slate-800 bg-amber-50 p-3 rounded-2xl border border-amber-200 leading-relaxed font-medium book-typography">
                  {currentArticle.quiz[currentQuizStep].hint}
                </p>
                <button
                  onClick={() => { soundEffects.click(); setShowHintModal(false); }}
                  class="w-full mt-3 py-2 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-xl text-sm sm:text-base transition shadow-md"
                >
                  다시 풀어보기
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
